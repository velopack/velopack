name: "Setup Job Environment"
description: "Installs dependencies like dotnet, rust, etc."

inputs:
  dotnet:
    description: 'Whether to install all dotnet versions'
    required: false
    default: 'false'
  rust-cache:
    description: 'Whether to run the rust-cache action'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # Defender realtime scanning adds significant IO overhead to builds/tests that spawn
    # thousands of short-lived processes and files. CI runners are ephemeral, so disable it.
    - name: Disable Windows Defender realtime scanning
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          Write-Host "Defender realtime monitoring disabled"
        } catch {
          Write-Host "Could not disable Defender realtime monitoring: $_"
        }
    - name: Setup dotnet
      if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Set DOTNET_ROOT
      if: inputs.dotnet != 'true'
      shell: bash
      run: |
        DOTNET_PATH="$(dirname "$(readlink -f "$(which dotnet)" 2>/dev/null || realpath "$(which dotnet)")")"
        echo "DOTNET_ROOT=$DOTNET_PATH" >> "$GITHUB_ENV"
    - name: Print dotnet version
      shell: pwsh
      run: dotnet --info
    - name: Install NBGV CLI
      shell: pwsh
      run: dotnet tool update -g nbgv
    - name: Set NBGV Variables
      shell: pwsh
      run: nbgv cloud -a -s GitHubActions
    - name: Update Project Version
      shell: pwsh
      run: ./.github/set-nbgv-version.ps1
    - name: Rust Cache
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        key: "${{ github.workflow }}"
