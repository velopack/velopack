name: Build Tests
on:
  workflow_call:

permissions:
  id-token: write
  actions: write
  contents: read

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  UV_FROZEN: "true"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            runner: windows-latest
            rust_flags: "--features windows"
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      ## RUST TESTS
      - name: Check lib-rust
        run: cargo check --locked -p velopack
      - name: Test Rust
        run: >-
          cargo llvm-cov nextest --locked --profile ci
          ${{ matrix.rust_flags }}
          --cobertura --output-path ./test/coverage/coverage.rust.${{ matrix.os }}.xml
      - name: Upload Rust Coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./test/coverage/coverage.rust.${{ matrix.os }}.xml
          flags: rust
      - name: Upload Rust Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: rust
      ## NODEJS TESTS
      - name: Clean Rust Build
        run: cargo clean
      - name: Setup Rust Coverage Instrumentation
        shell: bash
        run: cargo llvm-cov show-env | sed "s/='\(.*\)'/=\1/" >> "$GITHUB_ENV"
      - name: Check lib-nodejs
        working-directory: src/lib-nodejs
        run: |
          npm ci
          npm run build
          npm run test
      - name: Generate Node.js Rust Coverage
        shell: bash
        run: >-
          cargo llvm-cov report
          --cobertura --output-path ./test/coverage/coverage.rust-nodejs.${{ matrix.os }}.xml
      - name: Upload Node.js Coverage
        uses: codecov/codecov-action@v7
        with:
          directory: src/lib-nodejs/coverage
          files: ./test/coverage/coverage.rust-nodejs.${{ matrix.os }}.xml
          flags: nodejs
      - name: Upload Node.js Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: nodejs

  python:
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     os: [windows-latest, ubuntu-latest, macos-latest]
    # runs-on: ${{ matrix.os }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
      - name: Install Dependencies
        working-directory: src/lib-python
        run: |
          dotnet tool update -g vpk
          pip install uv
          uv sync
      - name: Check lib-python
        working-directory: src/lib-python/test
        run: uv run python run_test.py

  vpk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            # free runner: with cached TestApp publishes + parallel test collections this leg fits
            # under the vpk-deployment (ubuntu) critical path, so paid hardware buys no wall time
            runner: windows-latest
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      VELOPACK_GITHUB_TEST_TOKEN: ${{ secrets.VELOPACK_GITHUB_TEST_TOKEN }}
    steps:
      ## JOB SETUP
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
        with:
          dotnet: true
      # still required to run old/legacy packages, whose AppImage runtime needs libfuse2
      - name: Install FUSE
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install libfuse2
        if: ${{ matrix.os == 'ubuntu' }}
      - name: Install squashfs-tools
        run: brew install squashfs
        if: ${{ matrix.os == 'macos' }}
      # WindowsTestHelper.RunCoveredDotnet shells out to the dotnet-coverage CLI
      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage
      - name: Azure login
        uses: azure/login@v3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ## BUILD C# TESTS
      - name: Build .NET
        run: dotnet build -c Release
      - name: Wait for Artifacts
        uses: ./.github/actions/wait-artifact
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_wait_seconds: 900
          artifacts: rust-macos,rust-windows-x86,rust-windows-x64,rust-windows-arm64,rust-ubuntu-bins-x64,rust-ubuntu-bins-arm64
          verbose: true
      ## BUILD AND UPLOAD CROSS COMPILE ARTIFACTS
      - name: Download Rust Artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/release
          pattern: rust-*
          merge-multiple: true
      # The Rust testapp is built by the build-rust workflow and shipped inside the rust-* artifacts
      # just downloaded; put the host-native copy where the tests expect it (target/release/testapp).
      - name: Prepare Rust testapp
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp target/release/testapp_x64.exe target/release/testapp.exe
            cp target/release/testapp_x64.pdb target/release/testapp.pdb
          elif [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            cp target/release/testapp_linux_x64 target/release/testapp
            chmod +x target/release/testapp
          else
            cp target/release/testapp_osx target/release/testapp
            chmod +x target/release/testapp
          fi
      ## START PRIMARY RELEASETESTING
      - name: Test Velopack.Tests
        run: >-
          dotnet test --project test/Velopack.Tests/Velopack.Tests.csproj
          --no-build -c Release
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.Velopack.Tests.xml
      - name: Test Velopack.Packaging.Tests
        run: >-
          dotnet test --project test/Velopack.Packaging.Tests/Velopack.Packaging.Tests.csproj
          --no-build -c Release
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.Velopack.Packaging.Tests.xml
      - name: Test Velopack.CommandLine.Tests
        run: >-
          dotnet test --project test/Velopack.CommandLine.Tests/Velopack.CommandLine.Tests.csproj
          --no-build -c Release
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.Velopack.CommandLine.Tests.xml
      - name: Test Velopack.Pack.Tests
        run: >-
          dotnet test --project test/Velopack.Pack.Tests/Velopack.Pack.Tests.csproj
          --no-build -c Release
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.Velopack.Pack.Tests.xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ./test/coverage
          flags: vpk
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: vpk

  # Clean-room instrumented Pack.Tests run (rust coverage) + cross-compile pack/run tests.
  # Split from the vpk job so the two longest test phases run in parallel instead of serially.
  vpk-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            # free runner: with cached TestApp publishes + parallel test collections this leg fits
            # under the vpk-deployment (ubuntu) critical path, so paid hardware buys no wall time
            runner: windows-latest
            rust_flags: "--features windows"
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      ## JOB SETUP
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
        with:
          dotnet: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # still required to run old/legacy packages, whose AppImage runtime needs libfuse2
      - name: Install FUSE
        run: |
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install libfuse2
        if: ${{ matrix.os == 'ubuntu' }}
      - name: Install squashfs-tools
        run: brew install squashfs
        if: ${{ matrix.os == 'macos' }}
      # WindowsTestHelper.RunCoveredDotnet shells out to the dotnet-coverage CLI
      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage
      ## BUILD C# TESTS
      - name: Build .NET
        run: dotnet build -c Release
      - name: Wait for Artifacts
        uses: ./.github/actions/wait-artifact
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_wait_seconds: 900
          artifacts: rust-macos,rust-windows-x86,rust-windows-x64,rust-windows-arm64,rust-ubuntu-bins-x64,rust-ubuntu-bins-arm64
          verbose: true
      - name: Download Rust Artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/release
          pattern: rust-*
          merge-multiple: true
      # The Rust testapp is built by the build-rust workflow and shipped inside the rust-* artifacts
      # just downloaded; put the host-native copy where the tests expect it (target/release/testapp).
      - name: Prepare Rust testapp
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp target/release/testapp_x64.exe target/release/testapp.exe
            cp target/release/testapp_x64.pdb target/release/testapp.pdb
          elif [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            cp target/release/testapp_linux_x64 target/release/testapp
            chmod +x target/release/testapp
          else
            cp target/release/testapp_osx target/release/testapp
            chmod +x target/release/testapp
          fi
      ## BUILD AND UPLOAD CROSS COMPILE ARTIFACTS
      - name: Build Cross-Compile Artifacts
        run: >-
          dotnet test --project test/Velopack.CrossCompile.Tests/Velopack.CrossCompile.Tests.csproj
          --no-build -c Release
          --filter-method '*PackCrossApp*'
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.CrossCompile.Pack.xml
      - name: Upload Cross-Compile Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cross-${{ matrix.os }}
          path: test/artifacts/
          retention-days: 1
      ## START COVERAGE TESTING
      - name: Clean Rust Build
        run: cargo clean
      - name: Setup Rust Coverage Instrumentation
        shell: bash
        run: cargo llvm-cov show-env | sed "s/='\(.*\)'/=\1/" >> "$GITHUB_ENV"
      - name: Build Instrumented Rust Binaries
        run: cargo build --locked -p velopack_bins ${{ matrix.rust_flags }}
      - name: Test Velopack.Pack.Tests
        run: >-
          dotnet test --project test/Velopack.Pack.Tests/Velopack.Pack.Tests.csproj
      - name: Generate Rust Integration Coverage
        shell: bash
        run: >-
          cargo llvm-cov report
          --cobertura --output-path ./test/coverage/coverage.rust-integration.${{ matrix.os }}.xml
      ## START CROSS-COMPILATION TESTING
      - name: Clean Rust Build
        run: cargo clean
      - name: Wait for Artifacts
        uses: ./.github/actions/wait-artifact
        if: ${{ matrix.os == 'ubuntu' || matrix.os == 'windows' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_wait_seconds: 900
          artifacts: cross-macos,cross-ubuntu,cross-windows
          verbose: true
      - name: Download Cross Artifacts
        if: ${{ matrix.os == 'ubuntu' || matrix.os == 'windows' }}
        uses: actions/download-artifact@v8
        with:
          path: test/artifacts
          pattern: cross-*
          merge-multiple: true
      - name: Test Cross-Compiled Apps
        if: ${{ matrix.os == 'ubuntu' || matrix.os == 'windows' }}
        env:
          VELOPACK_CROSS_ARTIFACTS: true
        run: >-
          dotnet test --project test/Velopack.CrossCompile.Tests/Velopack.CrossCompile.Tests.csproj
          --no-build -c Release
          --filter-method '*RunCrossApp*'
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.CrossCompile.Run.xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ./test/coverage
          flags: vpk
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: vpk

  # Installs and updates the cross-compiled rust testapp packages on Windows 7. GitHub cannot host a runner
  # on Windows 7, so a prebuilt Win7 SP1 image (OpenSSH server, SHA-2 updates, user velo/velopack) boots
  # under QEMU/KVM with -snapshot, so every run starts clean, and the tests drive it over SSH.
  win7:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      WIN7_IMAGE_URL: https://pub-0302165a08f941e2b7c9bb0bcc15c438.r2.dev/fd5df5c4b6ac/win7-velopack.qcow2
      WIN7_IMAGE_SHA256: 02dde94efa0283b9e7f6d2b7509f0d2f69539754c3c2ea88846d993a9d1dbf4a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils sshpass
      - name: Download Windows 7 Image
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/win7.qcow2" "$WIN7_IMAGE_URL"
          echo "$WIN7_IMAGE_SHA256  $RUNNER_TEMP/win7.qcow2" | sha256sum -c
      # boots in the background while .NET builds and the cross-compile artifacts are produced
      - name: Boot Windows 7 VM
        run: >-
          qemu-system-x86_64 -machine pc,accel=kvm -cpu host -smp 2 -m 4096 -snapshot
          -drive file="$RUNNER_TEMP/win7.qcow2",if=ide
          -rtc base=utc -nic user,model=e1000,hostfwd=tcp:127.0.0.1:2222-:22
          -display none -daemonize -pidfile "$RUNNER_TEMP/qemu.pid"
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
        with:
          dotnet: true
      - name: Build Tests
        run: dotnet build test/Velopack.CrossCompile.Tests/Velopack.CrossCompile.Tests.csproj -c Release
      - name: Wait for Artifacts
        uses: ./.github/actions/wait-artifact
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_wait_seconds: 1800
          artifacts: cross-macos,cross-ubuntu,cross-windows
          verbose: true
      - name: Download Cross Artifacts
        uses: actions/download-artifact@v8
        with:
          path: test/artifacts
          pattern: cross-*
          merge-multiple: true
      - name: Wait for Windows 7 SSH
        run: |
          for i in $(seq 1 60); do
            sshpass -p velopack ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 -o LogLevel=ERROR velo@127.0.0.1 ver && exit 0
            sleep 5
          done
          echo "Windows 7 VM did not accept SSH connections"
          exit 1
      - name: Test Cross-Compiled Apps on Windows 7
        env:
          VELOPACK_WIN7_SSH: velo:velopack@127.0.0.1:2222
        run: >-
          dotnet test --project test/Velopack.CrossCompile.Tests/Velopack.CrossCompile.Tests.csproj
          --no-build -c Release
          --filter-method '*RunCrossAppWindows7*'
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.CrossCompile.Win7.xml
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: vpk

  vpk-deployment:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            # paid runner: needs the node + java toolchains that start-native-services.ps1
            # uses to host the deployment-test services natively (blacksmith mirrors the GitHub image).
            runner: blacksmith-4vcpu-windows-2025
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      VELOPACK_DEPLOYMENT_TEST_TOKEN: ${{ secrets.VELOPACK_DEPLOYMENT_TEST_TOKEN }}
    steps:
      ## JOB SETUP
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Job Environment
        uses: ./.github/actions/job-setup
        with:
          dotnet: true
      # start the stack detached and don't block on health: gitlab needs several minutes to boot,
      # which overlaps with the .NET build below. The wait step before the tests picks up the slack.
      - name: Start Deployment Test Services
        if: ${{ runner.os == 'Linux' }}
        run: docker compose -f test/Velopack.Deployment.Tests/docker/docker-compose.yml up -d
      # Windows runners cannot run Linux containers (the preinstalled docker is Windows-containers
      # only, and `wsl --install` hangs provisioning non-interactively) and macOS runners have no
      # docker at all, so the same services run natively — minus gitlab, which has no Windows/macOS
      # form and is covered by the Linux leg.
      - name: Start Deployment Test Services (native)
        if: ${{ runner.os != 'Linux' }}
        shell: pwsh
        run: ./test/Velopack.Deployment.Tests/docker/start-native-services.ps1
      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage
      ## BUILD C# TESTS
      - name: Build .NET
        run: dotnet build -c Release
      - name: Wait for Artifacts
        uses: ./.github/actions/wait-artifact
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_wait_seconds: 900
          artifacts: rust-macos,rust-windows-x86,rust-windows-x64,rust-windows-arm64,rust-ubuntu-bins-x64,rust-ubuntu-bins-arm64
          verbose: true
      - name: Download Rust Artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/release
          pattern: rust-*
          merge-multiple: true
      - name: Wait for Deployment Test Services
        if: ${{ runner.os == 'Linux' }}
        run: docker compose -f test/Velopack.Deployment.Tests/docker/docker-compose.yml up -d --wait --wait-timeout 900
      ## RUN DEPLOYMENT TESTS
      - name: Test Velopack.Deployment.Tests
        run: >-
          dotnet test --project test/Velopack.Deployment.Tests/Velopack.Deployment.Tests.csproj
          --no-build -c Release
          --report-github
          --report-spekt-junit --report-spekt-junit-filename ./test/coverage/junit.Velopack.Deployment.Tests.xml
          --coverage --coverage-output-format cobertura
          --coverage-output ${{ github.workspace }}/test/coverage/coverage.${{ matrix.os }}.Velopack.Deployment.Tests.xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ./test/coverage
          flags: vpk
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test/coverage/junit.*.xml
          flags: vpk

  # Advisories are published independently of our code, so this only fails on advisories the change
  # itself introduces (compared to the base commit). Pre-existing ones are reported as warnings and
  # tracked by the scheduled supply-chain.yml workflow, which files an issue.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check Rust bans, licenses and sources (cargo-deny)
        run: cargo deny check bans licenses sources

      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit advisories introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python .github/scripts/supply_chain_audit.py report
          else
            python .github/scripts/supply_chain_audit.py diff --base "$BASE_SHA"
          fi

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu, macos]
        include:
          - os: windows
            runner: windows-latest
            rust_flags: "--features windows"
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Clippy
        run: cargo clippy ${{ matrix.rust_flags }} -- -D warnings
