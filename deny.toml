[graph]
all-features = false

[advisories]
ignore = [
    # ttf-parser is unmaintained; pulled in transitively via xdialog -> cosmic-text -> fontdb, no replacement available
    { id = "RUSTSEC-2026-0192", reason = "unmaintained transitive dep via xdialog/cosmic-text, no drop-in replacement" },
    # zvariant/zbus_names/zvariant_derive were merged into zbus 6; xdialog and accesskit_unix (Linux AT-SPI) still need zbus 5
    { id = "RUSTSEC-2026-0370", reason = "unmaintained transitive dep via xdialog/accesskit_unix, awaiting zbus 6 upstream" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained transitive dep via xdialog/accesskit_unix, awaiting zbus 6 upstream" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained transitive dep via xdialog/accesskit_unix, awaiting zbus 6 upstream" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
